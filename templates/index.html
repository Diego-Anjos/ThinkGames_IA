<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Think Games AI - Descubra seu próximo jogo</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&display=swap" rel="stylesheet">
</head>
<body>

    <div class="container">
        <header>
            <h1 class="title">Think Games AI</h1>
            <p class="subtitle">Imagine o seu jogo perfeito. Descreva o mundo, a jogabilidade ou a história e deixe nossa IA descobrir títulos personalizados para você.</p>
        </header>

        <main>
            <div class="search-box">
                <textarea id="game-description" placeholder="Ex: um jogo de tiro tático em equipe com personagens..."></textarea>
                <button id="search-button">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="bi bi-search" viewBox="0 0 16 16">
                        <path d="M11.742 10.344a6.5 6.5 0 1 0-1.397 1.398h-.001q.044.06.098.115l3.85 3.85a1 1 0 0 0 1.415-1.414l-3.85-3.85a1 1 0 0 0-.115-.1zM12 6.5a5.5 5.5 0 1 1-11 0 5.5 5.5 0 0 1 11 0"/>
                    </svg>
                    <span class="button-text">Find My Game</span>
                    <div class="loader" style="display: none;"></div>
                </button>
            </div>

            <div id="results-container">
                </div>
        </main>
        
        <footer>
            <p>thinkplay.com</p>
        </footer>
    </div>

    <script>
        document.getElementById('search-button').addEventListener('click', async () => {
            const description = document.getElementById('game-description').value;
            const resultsContainer = document.getElementById('results-container');
            const button = document.getElementById('search-button');
            const buttonText = button.querySelector('.button-text');
            const loader = button.querySelector('.loader');
            const buttonIcon = button.querySelector('svg');

            if (!description.trim()) {
                resultsContainer.innerHTML = '<p class="error-message">Please describe the game you are looking for.</p>';
                return;
            }

            resultsContainer.innerHTML = '';
            buttonText.style.display = 'none';
            buttonIcon.style.display = 'none';
            loader.style.display = 'block';
            button.disabled = true;

            try {
                const response = await fetch('/suggest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ description: description }),
                });

                const suggestions = await response.json();

                if (suggestions.length > 0) {
                    suggestions.forEach(game => {
                        const card = document.createElement('div');
                        card.className = 'game-card';
                        card.innerHTML = `
                            <h3>${game.title}</h3>
                            <p>${game.description}</p>
                            <div class="platforms">
                                <strong>Available on:</strong> ${game.platforms.join(', ')}
                            </div>
                        `;
                        resultsContainer.appendChild(card);
                    });
                } else {
                    resultsContainer.innerHTML = '<p class="info-message">No games found matching your description. Try using different keywords.</p>';
                }

            } catch (error) {
                console.error('Error fetching suggestions:', error);
                resultsContainer.innerHTML = '<p class="error-message">An error occurred while fetching suggestions. Please try again later.</p>';
            } finally {
                buttonText.style.display = 'inline';
                buttonIcon.style.display = 'inline-block';
                loader.style.display = 'none';
                button.disabled = false;
            }
        });
    </script>

</body>
</html>
